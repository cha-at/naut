[package]
name = "naut"
version = "0.2.0"
description = "Naut: mobile-first DeepSeek chat client"
authors = ["Naut contributors"]
license = "MIT"
repository = "https://github.com/cha-at/naut"
edition = "2024"
rust-version = "1.90"

[lib]
name = "naut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[patch.crates-io]
# Tauri 移动端插件的 build script 会把 tauri-api 复制到自己的 Android 工程；
# 部分沙箱/只读 registry 环境不允许写 crates.io 源目录，因此使用仓库内的官方插件副本。
tauri-plugin-fs = { path = "plugins/tauri-plugin-fs" }
tauri-plugin-dialog = { path = "plugins/tauri-plugin-dialog" }
tauri-plugin-opener = { path = "plugins/tauri-plugin-opener" }
tauri-plugin-clipboard-manager = { path = "plugins/tauri-plugin-clipboard-manager" }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Android debug 构建会以 dev profile 编译"构建脚本的依赖"（这里走
# tauri-build -> tauri-winres -> embed-resource -> vswhom-sys 这条链）。
# cc-rs 看到 debug 打开时会给 MSVC 加 `-Z7`，而 cl.exe（19.51 / HostARM64）
# 在写调试记录时直接失败：`D8050: cannot execute c1xx.dll`。
# 构建脚本本来也不需要可调试，关掉它的 debuginfo 即可绕开。
[profile.dev.build-override]
debug = 0
